name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g., 0.1.0)'
        required: true
        default: '0.1.0'
      is_prerelease:
        description: 'Is this a Pre-release?'
        required: false
        type: boolean
        default: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Build Unsigned Release APK
      run: ./gradlew :app:assembleRelease
      env:
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: ${{ inputs.version_name || github.ref_name }}

    - name: Sign Release APK
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.RELEASE_SIGNING_KEY }}
        alias: ${{ secrets.RELEASE_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
        keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibreCans-Signed-Release-APK
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}

    - name: Set Release Details
      id: release_details
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "TAG_NAME=v${{ inputs.version_name }}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Release v${{ inputs.version_name }}" >> $GITHUB_ENV
        else
          echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Release ${{ github.ref_name }}" >> $GITHUB_ENV
        fi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        draft: false
        prerelease: ${{ inputs.is_prerelease == true }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
