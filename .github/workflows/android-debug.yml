name: Android Debug CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Generate Version Name and Code
      id: gen_version
      run: |
        TOTAL_COMMITS=$(git rev-list --count HEAD)

        # Get the latest tag (or default to v0.1.0)
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")

        # Strip the 'v' prefix
        BASE_VERSION=${LATEST_TAG#v}

        # Split into semantic parts
        IFS='.' read -r -a VERSION_PARTS <<< "$BASE_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}

        # Determine number of commits since that tag
        COMMITS_SINCE_TAG=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")

        # We always build debugs with an incremented patch version relative to the last tag
        # unless COMMITS_SINCE_TAG is 0 (which only happens if we are exactly on the tag).
        if [ "$COMMITS_SINCE_TAG" -gt "0" ]; then
           PATCH=$((PATCH + 1))
        fi

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          # Only count commits from the PR branch head down to the base ref
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          PR_COMMITS=$(git rev-list --count $BASE_SHA..HEAD 2>/dev/null || echo "1")
          echo "VERSION_NAME=${MAJOR}.${MINOR}.${PATCH}-pr${PR_NUMBER}-v${PR_COMMITS}" >> $GITHUB_ENV
        else
          echo "VERSION_NAME=${MAJOR}.${MINOR}.${PATCH}-main-v${COMMITS_SINCE_TAG}" >> $GITHUB_ENV
        fi

        echo "VERSION_CODE=$TOTAL_COMMITS" >> $GITHUB_ENV

    - name: Build Unsigned Debug APK
      run: ./gradlew :app:assembleDebug
      env:
        VERSION_CODE: ${{ env.VERSION_CODE }}

    - name: Sign Debug APK
      id: sign_app
      uses: ilharp/sign-android-release@v1
      with:
        releaseDir: app/build/outputs/apk/debug
        signingKey: ${{ secrets.RELEASE_SIGNING_KEY }}
        keyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
        keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        buildToolsVersion: 35.0.0

    - name: Rename APK
      run: mv ${{ steps.sign_app.outputs.signedFile }} LibreCans.apk

    - name: Upload Signed Debug APK Artifact
      uses: actions/upload-artifact@v4
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        name: LibreCans-Signed-Debug-APK
        continue-on-error: true
        path: LibreCans.apk
