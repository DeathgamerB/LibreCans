name: Android Debug CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Generate Version Name
      id: gen_version
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "VERSION_NAME=0.1.0-pr${PR_NUMBER}-v${{ github.run_number }}" >> $GITHUB_ENV
        else
          echo "VERSION_NAME=0.1.0-main-v${{ github.run_number }}" >> $GITHUB_ENV
        fi

    - name: Build Unsigned Debug APK
      run: ./gradlew :app:assembleDebug
      env:
        VERSION_CODE: ${{ github.run_number }}

    - name: Sign Debug APK
      id: sign_app
      uses: ilharp/sign-android-release@v1
      with:
        releaseDir: app/build/outputs/apk/debug
        signingKey: ${{ secrets.RELEASE_SIGNING_KEY }}
        keyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
        keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        buildToolsVersion: 35.0.0

    - name: Upload Signed Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LibreCans-Signed-Debug-APK
        path: ${{ steps.sign_app.outputs.signedFile }}
